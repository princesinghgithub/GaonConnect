<svg width="500" height="520" viewBox="0 0 500 520" xmlns="http://www.w3.org/2000/svg">

  <!-- Background cream -->
  <rect width="500" height="520" fill="#F5F2EB"/>

  <!-- ===================== -->
  <!-- G SHAPE - outer arc   -->
  <!-- ===================== -->
  <!-- Outer G in deep forest green -->
  <path d="
    M250,30
    A175,175 0 1,0 408,320
    L408,230
    L270,230
    L270,270
    L360,270
    A122,122 0 1,1 175,205
    Z
  " fill="#1B4D1E"/>

  <!-- Inner navy/dark blue fill (bottom of G = road) -->
  <path d="
    M270,230
    L408,230
    L408,320
    Q330,355 260,345
    A175,175 0 0,1 75,205
    L98,205
    A150,150 0 0,0 405,295
    L405,270
    L270,270
    Z
  " fill="#1A2F5E"/>

  <!-- ===================== -->
  <!-- GREEN FIELD inside G  -->
  <!-- ===================== -->
  <ellipse cx="210" cy="210" rx="80" ry="22" fill="#5A9E3A" opacity="0.5"/>
  <ellipse cx="210" cy="210" rx="55" ry="14" fill="#7DC44A" opacity="0.4"/>

  <!-- Field rows (crop lines) -->
  <path d="M148,220 Q200,215 270,225" stroke="#3E7A22" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M145,228 Q200,222 270,232" stroke="#3E7A22" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M145,236 Q200,230 268,240" stroke="#3E7A22" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- ===================== -->
  <!-- TREE (top-left of G)  -->
  <!-- ===================== -->
  <!-- Tree trunk -->
  <rect x="136" y="155" width="8" height="22" rx="2" fill="#6B3A1F"/>
  <!-- Tree canopy layers - mixed greens -->
  <ellipse cx="140" cy="148" rx="22" ry="20" fill="#2D6E1A"/>
  <ellipse cx="140" cy="136" rx="17" ry="15" fill="#3D8C25"/>
  <ellipse cx="140" cy="125" rx="12" ry="11" fill="#52A830"/>
  <ellipse cx="133" cy="142" rx="10" ry="9" fill="#4A9E2A" opacity="0.7"/>
  <ellipse cx="148" cy="138" rx="9" ry="8" fill="#63B83A" opacity="0.6"/>

  <!-- ===================== -->
  <!-- TRACTOR               -->
  <!-- ===================== -->
  <g transform="translate(155, 188)">
    <!-- Body -->
    <rect x="0" y="6" width="52" height="22" rx="4" fill="#2D6E1A"/>
    <!-- Hood -->
    <rect x="32" y="0" width="26" height="20" rx="3" fill="#3D8C25"/>
    <!-- Exhaust pipe -->
    <rect x="54" y="-8" width="5" height="14" rx="2" fill="#1B4D1E"/>
    <ellipse cx="56" cy="-9" rx="4" ry="3" fill="#555" opacity="0.6"/>
    <!-- Windows -->
    <rect x="34" y="3" width="10" height="8" rx="1" fill="#A8D8F0" opacity="0.8"/>
    <!-- Big rear wheel -->
    <circle cx="14" cy="30" r="14" fill="#1A1A1A"/>
    <circle cx="14" cy="30" r="10" fill="#333"/>
    <circle cx="14" cy="30" r="4" fill="#888"/>
    <!-- Small front wheel -->
    <circle cx="47" cy="30" r="9" fill="#1A1A1A"/>
    <circle cx="47" cy="30" r="6" fill="#333"/>
    <circle cx="47" cy="30" r="2.5" fill="#888"/>
  </g>

  <!-- ===================== -->
  <!-- TRUCK / MINI TRUCK    -->
  <!-- ===================== -->
  <g transform="translate(235, 255)">
    <!-- Truck bed/body -->
    <rect x="0" y="0" width="90" height="28" rx="4" fill="#E8E8E8"/>
    <!-- Cabin -->
    <rect x="62" y="-18" width="34" height="28" rx="4" fill="#1A2F5E"/>
    <!-- Windshield -->
    <rect x="64" y="-14" width="14" height="12" rx="2" fill="#A8D8F0" opacity="0.8"/>
    <!-- Headlight -->
    <rect x="93" y="-6" width="4" height="6" rx="1" fill="#FFD700"/>
    <!-- Wheels -->
    <circle cx="18" cy="30" r="10" fill="#1A1A1A"/>
    <circle cx="18" cy="30" r="6" fill="#444"/>
    <circle cx="18" cy="30" r="2.5" fill="#888"/>
    <circle cx="55" cy="30" r="10" fill="#1A1A1A"/>
    <circle cx="55" cy="30" r="6" fill="#444"/>
    <circle cx="55" cy="30" r="2.5" fill="#888"/>
    <circle cx="80" cy="30" r="10" fill="#1A1A1A"/>
    <circle cx="80" cy="30" r="6" fill="#444"/>
    <circle cx="80" cy="30" r="2.5" fill="#888"/>
  </g>

  <!-- ===================== -->
  <!-- ROAD                  -->
  <!-- ===================== -->
  <path d="M100,310 Q250,295 410,305 L410,325 Q250,315 100,330 Z" fill="#1A2F5E" opacity="0.7"/>
  <!-- Road dashes white -->
  <rect x="150" y="313" width="16" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="190" y="312" width="16" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="230" y="311" width="16" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="270" y="311" width="16" height="4" rx="2" fill="white" opacity="0.7"/>
  <rect x="310" y="311" width="16" height="4" rx="2" fill="white" opacity="0.7"/>

  <!-- Small birds -->
  <path d="M300,75 Q305,68 310,75" stroke="#1B4D1E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M318,62 Q325,54 332,62" stroke="#1B4D1E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M338,78 Q343,72 348,78" stroke="#1B4D1E" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ===================== -->
  <!-- TEXT SECTION          -->
  <!-- ===================== -->
  <!-- Dash lines -->
  <line x1="30" y1="370" x2="120" y2="370" stroke="#1B4D1E" stroke-width="2"/>
  <line x1="380" y1="370" x2="470" y2="370" stroke="#1B4D1E" stroke-width="2"/>

  <!-- GAON -->
  <text x="250" y="375"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="64"
    font-weight="700"
    fill="#1B4D1E"
    letter-spacing="8">GAON</text>

  <!-- CONNECT -->
  <text x="250" y="430"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="48"
    font-weight="700"
    fill="#1A2F5E"
    letter-spacing="10">CONNECT</text>

  <!-- Tricolor underline -->
  <rect x="80" y="440" width="340" height="4" rx="2" fill="#E85500"/>
  <rect x="80" y="444" width="340" height="4" rx="2" fill="#FFFFFF" stroke="#ddd" stroke-width="0.3"/>
  <rect x="80" y="448" width="340" height="4" rx="2" fill="#2D7A27"/>

  <!-- Tagline -->
  <text x="250" y="478"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#555555"
    letter-spacing="2.5">CONNECTING VILLAGES, EMPOWERING INDIA</text>

</svg>
