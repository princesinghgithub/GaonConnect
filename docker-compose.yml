version: '3.9'

services:
  # ─── Node.js App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaonconnect_app
    ports:
      - '${PORT:-5000}:5000'
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/gaonconnect
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - gaonconnect_net

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gaonconnect_redis
    ports:
      - '6379:6379'
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gaonconnect_net

  # ─── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: gaonconnect_mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: gaonconnect
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok", '--quiet']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - gaonconnect_net

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  redis_data:
  mongo_data:
  uploads_data:

# ─── Network ──────────────────────────────────────────────────────────────────
networks:
  gaonconnect_net:
    driver: bridge
