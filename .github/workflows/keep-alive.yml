name: Keep Render backend awake

# Render's free/starter tier sleeps after ~15 min of no traffic; the first
# request after that can take 20-50s to "wake" it, which is what made both
# apps feel slow on launch. Pinging /health every 10 min keeps it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 https://gaonconnect-backend.onrender.com/health || echo "Ping failed (backend may have been cold-starting)"
